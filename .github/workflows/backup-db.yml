# Daily PostgreSQL backup for Supabase Free tier (which has no automatic backups).
#
# Required secret (GitHub repo → Settings → Secrets and variables → Actions):
#   secrets.SUPABASE_DB_URL — session-pooler URI, e.g.:
#     postgresql://postgres.<ref>:<password>@aws-0-eu-west-1.pooler.supabase.com:5432/postgres
#
# Stores a compressed SQL dump (schema + data for `public` and `auth`) as a
# GitHub Actions artifact retained for 30 days.
name: backup-db

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump Supabase database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::SUPABASE_DB_URL secret is not configured yet — skipping dump"
            exit 0
          fi
          STAMP=$(date -u +"%Y-%m-%d_%H%M")
          OUT="rallymonitor_${STAMP}.sql.gz"
          pg_dump "${SUPABASE_DB_URL}" \
            --no-owner --no-privileges \
            --schema=public --schema=auth \
            | gzip -9 > "${OUT}"
          ls -lh "${OUT}"
          echo "BACKUP_FILE=${OUT}" >> "$GITHUB_ENV"

      - name: Upload backup artifact (30 days retention)
        if: env.BACKUP_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
